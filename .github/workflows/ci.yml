name: Test OrderFlow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: H2, PostgreSQL, and RabbitMQ tests
        run: mvn -B -Pinfra verify
      - name: Build Docker image
        run: docker build -t orderflow:test .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
