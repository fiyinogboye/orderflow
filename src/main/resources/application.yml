server:
  port: 8081
  address: 127.0.0.1
  servlet.session.cookie.same-site: strict
spring:
  application.name: orderflow
  datasource:
    url: jdbc:h2:file:./data/orderflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway.enabled: true
  rabbitmq:
    listener.simple.auto-startup: false
management:
  endpoints.web.exposure.include: health
  health.rabbit.enabled: false
orderflow:
  transport: local
  scheduling: true
  poll-ms: 1500
  retry-delay-ms: 3000
  demo-password: ${DEMO_PASSWORD:learn1234}
